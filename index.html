<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NoidCat | Coming soon</title>
<meta name="description" content="NoidCat. Coming soon. Always watching.">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://noidcat.com/">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/favicon-192.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<style>
:root{--bg:#000;--fg:#f2f2f2;--muted:#9aa39a;--g:#39ff14;--line:#1c2a1a;
--font:"Inter","Helvetica Neue",Arial,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);line-height:1.5;
background-image:radial-gradient(ellipse at 50% 20%,rgba(57,255,20,.12),transparent 60%);
display:flex;align-items:center;justify-content:center;text-align:center;padding:32px 20px}
main{display:flex;flex-direction:column;align-items:center}
.logo-wrap{width:min(60vw,260px);aspect-ratio:1;border-radius:50%;overflow:hidden;
box-shadow:0 0 0 1px var(--line),0 0 60px rgba(57,255,20,.18)}
.logo-wrap img{width:100%;height:100%;display:block;object-fit:cover}
h1{margin:28px 0 0;font-size:clamp(48px,13vw,104px);line-height:.95;font-weight:900;letter-spacing:-2px;color:#fff}
.soon{display:inline-flex;align-items:center;gap:10px;margin:22px 0 0;padding:8px 16px;border:1px solid var(--g);border-radius:999px;
color:var(--g);font-size:15px;font-weight:800;letter-spacing:1px;text-transform:uppercase;background:rgba(57,255,20,.06)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--g);box-shadow:0 0 10px var(--g);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.x{margin-top:28px;color:var(--muted);font-size:14px;text-decoration:none;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.x svg{width:14px;height:14px;fill:currentColor}
.x:hover{color:var(--g)}
:focus-visible{outline:2px solid var(--g);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
</style>
</head>
<body>
<main>
  <div class="logo-wrap"><img src="assets/logo.webp" alt="NoidCat logo: black cat head with glowing green ① eyes" width="512" height="512"></div>
  <h1>NoidCat</h1>
  <p class="soon"><span class="dot" aria-hidden="true"></span>Coming soon</p>
  <a class="x" href="https://x.com/NO1DCat" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.9 2H22l-7.6 8.7L23 22h-6.8l-5.3-6.9L4.8 22H1.7l8.1-9.3L1 2h7l4.8 6.3L18.9 2Zm-1.2 18h1.9L7.1 3.9H5.1L17.7 20Z"/></svg>@NO1DCat</a>
</main>
</body>
</html>
